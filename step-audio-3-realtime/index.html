<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step-Audio 3 Realtime · StepFun</title>
<link rel="icon" type="image/svg+xml" href="assets/brand/step-favicon.svg">
<meta name="description" content="Step-Audio 3 Realtime brings natural, full-duplex voice conversation together with adaptive reasoning and agent capabilities.">
<style>
  /* ---------- 字体 ----------
     MiSans（小米，免费商用），子集化到本页实际用到的字符。
     改文案后重跑 tools/build_fonts.py，否则新字会掉到系统字体兜底。 */
  @font-face{font-family:MiSans;font-style:normal;font-weight:200;font-display:swap;
             src:url(assets/fonts/MiSans-ExtraLight.woff2) format('woff2')}
  @font-face{font-family:MiSans;font-style:normal;font-weight:300;font-display:swap;
             src:url(assets/fonts/MiSans-Light.woff2) format('woff2')}
  @font-face{font-family:MiSans;font-style:normal;font-weight:400;font-display:swap;
             src:url(assets/fonts/MiSans-Regular.woff2) format('woff2')}
  @font-face{font-family:MiSans;font-style:normal;font-weight:700;font-display:swap;
             src:url(assets/fonts/MiSans-Bold.woff2) format('woff2')}

  /* ---------- 品牌字标字体 ----------
     用户认出商标字体和 Safari 标签页字体一致 —— 那是苹果系统字 SF Pro。
     这个判断比我的像素比对可信（他是拿每天都看的实时渲染对照的），
     而且和测量吻合：等 cap 高时商标字宽比 Inter/Archivo 窄 7~12%，SF Pro 正是偏紧凑的。

     **SF Pro 不能作为 webfont 内嵌**（苹果许可只允许在苹果平台的界面里使用系统字，
     不允许打包分发字体文件）。所以：
       苹果设备 → -apple-system / BlinkMacSystemFont 直接取系统里的 SF Pro，精确匹配；
       其他平台 → 自托管 Roboto Medium 兜底（等 cap 高时字宽只差 +2.8%，
                  是这批候选里最接近的；Inter/Archivo 都偏宽）。
     兜底文件按 600 声明、实际是 Medium(500) 字形：非苹果平台上要的是中粗而不是 Bold。 */
  @font-face{font-family:BrandFallback;font-style:normal;font-weight:600;font-display:swap;
             src:url(assets/fonts/Roboto-Medium.woff2) format('woff2')}

  /* ---------- token ----------
     沿用两个模型展示页的深色 token，保持一家人的观感 */
  :root{
    --bg-0:#07070C;
    --bg-1:#0D0B18;
    --indigo:#6366F1;
    --purple:#A855F7;
    --cyan:#22D3EE;
    --text:#FFFFFF;
    --text-2:rgba(255,255,255,.72);
    --text-3:rgba(255,255,255,.50);
    --text-4:rgba(255,255,255,.34);
    --line:rgba(255,255,255,.09);
    --line-2:rgba(255,255,255,.16);
    --card:rgba(255,255,255,.028);
    --card-hover:rgba(255,255,255,.05);
    --tbd:#FBBF24;                 /* 占位一律琥珀，一眼看出不是真数据 */
    --tbd-line:rgba(251,191,36,.34);
    --line-3:rgba(255,255,255,.42);
    --surface:#07070C;             /* 卡片底色，浅色区会覆盖成纯白 */
    --max-w:1140px;
    --font:"MiSans","PingFang SC","Noto Sans SC","Microsoft YaHei",
           system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    /* 品牌字标专用栈：**统一用自托管的 Roboto Medium，不再引用苹果系统字**。
       原来是 -apple-system / SF Pro 打头、Roboto 兜底，苹果设备上取真 SF Pro。
       改掉的理由是**规避苹果字体的授权问题**（按要求）—— 虽然「按名字引用系统字」
       并不分发字体文件、风险很低，但统一成自托管之后还有个实打实的好处：
       **跨平台字形完全一致**，不再有「苹果上是 SF Pro、别处是 Roboto」的细微差别。
       注意 Roboto-Medium.woff2 是**子集化**的（现 21 个码位 / 5.6KB），
       字符集是 ` 3AFGMRSacdeilmnopstu` —— 刚好覆盖
       "StepAudio 3 Realtime"、"Gen"、"Music" 与 "StepFun"。
       **改字标文案必须重做这个子集**，而且 tools/build_fonts.py 只管 MiSans、不含 Roboto：
       Roboto 要单独从 Google Fonts 取 latin 分片再 fontTools 子集化
       （加 Realtime 那次就缺了 R/a/l/m 四个字形，不补就直接显示不出来）。 */
    --font-brand:BrandFallback,"Helvetica Neue",Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:auto;background:var(--bg-0)}
  body{
    background:var(--bg-0);color:var(--text);font-family:var(--font);
    font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  ::selection{background:rgba(99,102,241,.45)}

  /* ================= 视频舞台 ================= */
  #stage{
    position:fixed;inset:0;z-index:10;background:#000;
    /* 这条现在是真正的开场淡入（黑屏闪字那段已删）。不能太慢，
       否则第一镜前半段是在渐亮中度过的。 */
    opacity:0;transition:opacity .7s ease;
  }
  #stage.playing{opacity:1}
  #stage video{width:100%;height:100%;object-fit:cover;display:block}
  /* 字标背景再压一层暗：A23 与后续完整轮播里都有明亮画面，不压的话渐变字标读不出来。
     这层从**字标浮现那一刻**就挂上并一直留着（.ended 由 revealMark() 添加），
     首轮前两段播放中不加，素材该亮就亮。 */
  #stage .endscrim{
    position:absolute;inset:0;pointer-events:none;opacity:0;
    transition:opacity 1.2s ease;
    background:
      /* 暗只压在字标那一条带上，四角留亮 —— 画面要好看，不能整张糊黑 */
      radial-gradient(64% 42% at 50% 50%,rgba(7,7,12,.66),rgba(7,7,12,.34) 56%,transparent 82%),
      linear-gradient(180deg,rgba(7,7,12,.30),rgba(7,7,12,.06) 44%,rgba(7,7,12,.40));
  }
  #stage.ended .endscrim{opacity:1}
  /* 压一层暗角，让后面浮上来的字标不至于被素材的高光吃掉 */
  #stage .veil{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%,transparent 38%,rgba(7,7,12,.55) 100%);
  }

  /* ================= 字标浮现 ================= */
  #reveal{
    position:fixed;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    /* gap 也要**等比**，不能是固定 26px。基准是 1440x810（视口正好 16:9、
       cover 之后画面=视口）那一档：26/810 = 画面高的 3.21%。竖屏下画面高
       = 56.25vw，所以同一比例 = 1.806vw。上限钉在 26px —— 1440 及以上原样不变。
       留着 26px 的后果实测很明显：390 宽下两道 gap 合计 52px，
       在只有 219px 高的画面里占 24%，字标组整个被撑散。 */
    gap:clamp(7px,1.806vw,26px);
    opacity:0;pointer-events:none;transition:opacity 1.6s ease;
    /* 和正文同一套安全边距。**不能改成给 .reveal-sub 加 padding** ——
       它宽度是 shrink-to-fit，加 padding 只会让整体更宽；要让文字提前换行
       就得约束容器。320 宽下英文副标实测正好 320px，不加这层是贴死两边的。 */
    padding-inline:clamp(20px,5vw,32px);
  }
  #reveal.on{opacity:1}
  /* 放开滚动后摘掉 transition：这条 1.6s 是给字标浮现用的，
     留着会让滚动淡出比手指慢 1.6s，字标飘在溶解区里 —— 正是「过渡突兀」的来源。 */
  #reveal.nofade{transition:none}
  /* **滚动驱动时用短动画。** 滚动既触发浮现、又同时驱动淡出
     （onScroll 里 opacity = 1 - top/(0.38 屏)），两者打架：实测 810px 视口下
     滚 80px（约两下滚轮）目标 opacity 已降到 0.74，而 1.6s 的淡入才走一半 ——
     用户看到的就是「还没显现出来就已经滑下去了」。
     所以滚动触发走这条 `.fast`：淡入 0.22s、字距 0.85s，一划就看得见。
     时间驱动（不滚的用户）仍用原来那套慢动画，开屏的仪式感不变。 */
  #reveal.fast{transition:opacity .22s ease}
  #reveal.fast .wordmark{transition:letter-spacing .85s cubic-bezier(.16,.84,.24,1),
                         filter .38s ease,
                         transform .85s cubic-bezier(.16,.84,.24,1)}
  #reveal.fast .reveal-sub{transition:opacity .32s ease .16s}
  #reveal.fast .sweep::after{animation-duration:1.1s;animation-delay:.18s}
  .wordmark{
    position:relative;
    font-family:var(--font-brand);
    /* **拆成两行**：下行 "Realtime" 是主体（1.10em），上行 "StepAudio 3" 压小
       （.42em），主次比 **1:2.62**。这个 clamp 是「基准字号」，两行都按 em 乘它，
       所以下行实际 114.4px、上行 43.7px @1440。
       **7.6vw 这个斜率就是电脑端的比例**：基准档 1440x810 实测
       基准字号/画面宽 = 7.22%，和 7.6vw 差 5%，本来就对得上。
       问题一直出在**下限**：原来是 38px，390 宽下 7.6vw 只有 29.6px、被顶到 38px，
       于是字标组占掉画面高的 60%（电脑端是 30%）—— 就是「手机上太挤」的来源。
       下限定 **24px**：320 宽下 7.6vw = 24.3px 刚好不触发，
       也就是**所有主流手机都走等比**，下限纯粹是防御（折叠屏分屏、桌面缩到极窄）。
       取 26px 试过一版：320 下会被顶住、宽度比例多出 5.1pp，
       下限本该兜底、结果成了破坏比例的那一方。
       nowrap 不会溢出：320 下实测 128px，可用宽度 280px。 */
    display:flex;flex-direction:column;align-items:center;
    font-size:clamp(24px,7.6vw,104px);font-weight:600;line-height:1.04;
    letter-spacing:.30em;                     /* 先宽 */
    transform:translateY(14px);
    /* **渐变已下移到 .wm-main**（只有 "Realtime" 那行是彩色，上行是纯白）。
       这里只留 filter —— 它作用于整个子树，两行的阴影/浮现模糊都靠它。 */
    filter:blur(9px) drop-shadow(0 2px 22px rgba(0,0,0,.5));
    transition:letter-spacing 2.4s cubic-bezier(.16,.84,.24,1),
               filter 1.8s ease, transform 2.4s cubic-bezier(.16,.84,.24,1);
    white-space:nowrap;
  }
  /* 上行 .42em。**两行的字号都写 em 而不是绝对值**，这样一起跟着 .wordmark 的
     clamp 缩放，手机上主次比例不走形（改过一次比例：.5/1 → .42/1.10）。 */
  /* 上行的颜色和副标**对调过**（按要求：凸显副标、淡化 "StepAudio 3"）。
     原来这里是纯白 #FFF、副标是 --text-2，实测笔画亮度 255 vs 194、
     对比背景 +188 vs +136 —— 视觉重量确实压在产品名上而不是那句话上。
     现在两者互换：这一行走 **rgba(255,255,255,.60)**（对调时先给 --text-2，
     再按「灰一点」下调，最后定在 .60），副标走纯白。
     实测四档笔画亮度 / 对比背景（390 宽，12.4px 那个尺寸）：
       .72=200/+139   **.60=176/+117**   .50=157/+97   .34=127/+66
     试到 .34 就过头了 —— 行尾那个 "3" 落在亮背景上已经开始融进去。

     **这里是本页唯一写 rgba 字面量而不用 token 的地方**，两个理由：
       ① .60 落在 --text-2(.72) 和 --text-3(.50) 之间，为一处声明加个全局 token 不值当；
       ② 深浅两套 token 里 --text-* 各有一份定义，用变量的好处是跟着 .sheet 翻色 ——
          但**字标区只存在于深色的开屏层、从不进入 .sheet**，这个好处在这里用不上。
     如果以后字标区要跟着翻色，得先把它换回 token。

     渐变仍然挂在 .wm-main 上、不在父元素 .wordmark：
     只给这里写 color 的话，父元素被 background-clip:text 裁出的渐变
     会垫在字下面、边缘透出彩色（这是当初把渐变下移的原因，别改回去）。 */
  .wm-top{font-size:.42em;display:block;color:rgba(255,255,255,.60)}
  /* 彩色只剩这一行：沿用第一版闪字里那条 cyan→indigo→purple 的渐变。
     background-clip:text 要求 color 透明，所以描边/阴影只能走父元素的 filter。
     渐变现在在这一行自己的宽度上展开（492px @1440），
     比原来跨整块展开更饱满 —— 原来上行只取到中段那点 indigo。 */
  .wm-main{font-size:1.10em;display:block;
           background:linear-gradient(92deg,var(--cyan),var(--indigo) 55%,var(--purple));
           -webkit-background-clip:text;background-clip:text;color:transparent}
  #reveal.on .wordmark{
    /* 落定字距 **+.05em**（按要求两次放开）。历程：单行长文案 +.012em →
       拆两行后按「和左上角一样」收到 −.025em → +.02em → +.05em。
       两行共用同一个 em 值，所以下行的绝对间距是上行的 2.6 倍（跟字号比一致）。
       再往上到 +.08em 时上行「StepAudio 3」会开始散架，别越过。 */
    letter-spacing:.05em;transform:translateY(0);
    filter:blur(0) drop-shadow(0 2px 22px rgba(0,0,0,.5));
  }
  /* 字标下的细光带：扫过一次后隐去 */
  .sweep{
    /* 30vw 而不是 46vw：电脑端实测光带 420px / 画面 1440px = 29.2%，
       46vw 在 390 宽手机上是 45.9%，相对画面宽了一半。
       上限 420px 保持，所以 1400 以上一个像素都没变。 */
    position:relative;width:min(30vw,420px);height:1px;
    background:var(--line);overflow:hidden;
  }
  .sweep::after{
    content:"";position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,var(--cyan),var(--indigo),transparent);
  }
  #reveal.on .sweep::after{animation:sweep 2.1s 1.1s cubic-bezier(.4,0,.2,1) forwards}
  @keyframes sweep{
    0%{transform:translateX(-100%);opacity:1}
    70%{opacity:1}
    100%{transform:translateX(100%);opacity:0}
  }
  .reveal-sub{
    display:flex;align-items:center;gap:11px;
    /* **换行后要居中。** 容器是 flex、宽度 shrink-to-fit，所以单行时看不出问题；
       但 320 宽下英文副标（实测 320px）会被 #reveal 的 padding-inline 逼到
       两行，此时行内文字按默认的 start 排 —— 两行左对齐、整块看着偏出画面。 */
    text-align:center;
    /* 15px → 22px（按要求放大）。**字距要跟着从 .24em 收到 .18em** ——
       .24em 是给 12~15px 小字设计的，放大后不收会显得散。
       字重/大写/--text-2 都保持不变，仍是「宽字距副标」那个调性。 */
    /* 下限 **6px**（走过 14 → 12 → 10 → 6，最后一档是用户在真机上确认可读后定的）。
       意义是**这条终于也等比了**：下限压到 6px 之后，390 及以上的手机全部走
       `1.6vw` 本身（390 下 6.24px），而 `1.6vw` 就是电脑端的比例
       （22px / 1440px = 1.53%）—— 副标/字标实测 21.1% vs 电脑端 21.2%。
       整组四个量至此全部等比，没有例外了。

       历程里两个不同的动机，别混在一起看：
         · **14 → 12 是修折行**：英文副标 14px 实测 320px 宽，在 320 屏上被
           padding 逼成两行，两行在 180px 高的画面里占掉 21%，组高偏离 +21.9pp。
         · **12 → 10 → 6 换的是主次关系，不是组高**。组高的大头是字标那 46.8px、
           副标只占十几 px，所以砍字号对组高几乎没用（12→9 砍 25% 只换 1.7pp）；
           但「副标/字标」是线性的：40.5% → 33.7% → 21.1%。

       6px 能成立靠三件事，改文案/配色时都得留意：
         ① 全大写（英文）+ .18em 字距 —— 不是小号正文；
         ② DPR≥2 的手机上是 12+ 物理像素；
         ③ 页面有 `viewport width=device-width`，所以 Android Chrome 的
            text autosizing（font boosting）不会介入把它顶大。
       **line-height 仍然不动**：设 1 能再省 1pp，但会一并收紧电脑端的副标行盒
       （30px→22px），那边的间距调过很多轮，不为 1pp 去碰。
       1440 及以上仍是 22px 上限，电脑端一个像素没动。 */
    font-size:clamp(6px,1.6vw,22px);font-weight:300;letter-spacing:.18em;
    /* 副标走**纯白**（和上行对调，见 .wm-top 的注释）。
       历程是 text-3 → text-2 → #FFF：循环背景里有明亮天光，text-3 当初就太淡读不出；
       现在既要凸显它、又刚好帮到 6px 那一档的可读性，纯白是同一个方向。
       字影保留 —— 白字压在亮画面上仍需要一层压边。 */
    color:var(--text);text-transform:uppercase;
    text-shadow:0 1px 10px rgba(0,0,0,.55);
    opacity:0;transition:opacity 1.4s ease 1.6s;
  }
  /* **中文副标的下限单独留在 10px。** 上面那个 6px 是按比例算出来的
     （1.6vw = 电脑端的 22/1440），拉丁全大写在这个尺寸上仍然立得住 ——
     字形只有几笔、没有降部、又有 .18em 字距撑开。
     中文不行：7 个字都是多笔画方块，6px 下笔画开始并到一起。
     所以这一条**是刻意的语言差异，不是漏改**：切换语言时副标会跳一档大小。
     选择器用 :lang(zh) 而不是 [lang="zh-CN"] —— htmlLang 现在是 "zh-CN"，
     写死属性值以后加 zh-TW 之类就漏了，:lang() 本来就做语言范围匹配。
     特异性 (0,2,0) 高于上面的 (0,1,0)，所以放在这里就能覆盖。
     1440 及以上两种语言都取 22px 上限，电脑端不受影响。 */
  .reveal-sub:lang(zh){
    font-size:clamp(10px,1.6vw,22px);
    /* 中文字距单独放到 **.30em**（英文留在 .18em —— 全大写本身就有字距感）。
       试过四档，.38em 开始散、.24em 变化不明显。 */
    letter-spacing:.30em;
    /* **负尾距，抵消最后一个字后面那一份字距。** CSS 的 letter-spacing 会加在
       每个字符后面、包括末字，所以「容器居中」并不等于「墨迹居中」——
       容器比墨迹宽一个字距，居中后墨迹左偏半个字距。
       实测（视频定帧后用「显示/隐藏副标两张图相减」求墨迹重心）：
         .18em 偏左 2.34px → .30em 偏左 4.14px → 加这行后 1.07px
       残下的 1.07px 是字形本身左右不对称（"为" 与 "生" 的墨量不同），跟字距无关。
       英文那档不加：6.24px × .18em 的尾距只有 1.12px、偏移 0.56px，不值当。

       **量墨迹重心必须用 diff，不能取「区域内的亮像素」。** 背景是活动画面，
       亮部会被当成笔画：直接取亮像素实测 1440 偏 +15px、390 偏 −17px，
       两个方向相反 —— 那量的是背景不是字。
       另外 diff 前**要先让字标浮现再 pause**：revealWatch 靠播放中的轮询触发，
       先 pause 的话 #reveal 永远拿不到 .on，两张图都是无字、diff 恒为 0。 */
    margin-inline-end:-.30em;
  }
  #reveal.on .reveal-sub{opacity:1}

  /* 跳过 / 语言 */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:50;
          display:flex;justify-content:space-between;align-items:center;
          padding:20px clamp(18px,4vw,44px);pointer-events:none}
  .topbar > *{pointer-events:auto;position:relative;z-index:1}
  /* 滚进正文后给顶栏垫一层底：否则窄屏上「StepAudio 3」和语言胶囊会直接压在
     正文标题上，两层字叠着看不清（headless 截图里一眼就看出来了）。 */
  .topbar::before{
    content:"";position:absolute;inset:0;opacity:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(7,7,12,.92),rgba(7,7,12,.62) 62%,transparent);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    transition:opacity .35s ease;
  }
  /* 顶栏滚进浅色正文后整套翻过来：白底上原来的白字/深胶囊会看不见 */
  .topbar.solid::before{
    opacity:1;
    background:linear-gradient(180deg,rgba(239,239,236,.95),rgba(239,239,236,.70) 62%,transparent);
  }
  .topbar.solid .brand-lockup{color:#15171C}
  .topbar.solid .chip{background:rgba(255,255,255,.62);
                      border-color:rgba(21,23,28,.22);color:rgba(21,23,28,.66)}
  .topbar.solid .chip:hover{color:#15171C;border-color:rgba(21,23,28,.46)}
  .topbar.solid .lang b{color:#15171C}
  /* 公司商标：从第一帧就在（品牌锚点），颜色走 currentColor，
     所以顶栏翻浅色时它自己就变深了。 */
  /* 顶栏品牌锁定沿用 StepAudio 3 Gen 的格式：StepFun | 产品名 | 产品名。 */
  .brand-lockup{display:flex;align-items:center;gap:7px;color:var(--text)}
  .brand-div{color:currentColor;opacity:.34;flex:none;font:400 13px/1 var(--font-brand)}
  .brand-div-main{opacity:.88;font-weight:700}
  .brand-prod{display:inline-flex;align-items:center;gap:3px;
              font-family:var(--font-brand);font-size:14px;font-weight:600;
              line-height:1.55;letter-spacing:-.01em;white-space:nowrap}
  .brand-prod a{display:inline-flex;align-items:center;min-height:30px;padding:3px 7px;
                border-radius:7px;color:inherit;text-decoration:none;opacity:.56;
                background:transparent;transition:opacity .2s ease,background-color .2s ease}
  .brand-prod a[aria-current="page"]{opacity:1}
  .brand-prod a:hover{opacity:1;background:rgba(255,255,255,.14)}
  .topbar.solid .brand-prod a:hover{background:rgba(21,23,28,.08)}
  .brand-prod a:focus-visible{outline:1px solid currentColor;outline-offset:4px}
  @media (max-width:900px){ .brand-lockup > .brand-div,.brand-prod{display:none} }
  .brand{display:block;color:inherit;opacity:.92;transition:opacity .3s ease}
  .brand:hover{opacity:1}
  .brand svg{display:block;height:22px;width:auto}
  @media (max-width:640px){ .brand svg{height:19px} }
  .ctrls{display:flex;gap:10px;align-items:center}
  .chip{
    border:1px solid var(--line-2);background:rgba(0,0,0,.28);color:var(--text-3);
    font-family:var(--font);font-size:11.5px;letter-spacing:.14em;font-weight:300;
    padding:7px 13px;border-radius:999px;cursor:pointer;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    transition:color .25s,border-color .25s,background .25s;
  }
  .chip:hover{color:var(--text);border-color:rgba(255,255,255,.4)}
  .chip[hidden]{display:none}
  /* 体验中心：**照 stepaudio3-gen-demo 的 .header-action 做的实心按钮**
     （白底 #F5F7FA / 黑字 #050608，12px/700，圆角 10px，padding 11px 15px，
     hover 上移 2px）。原来是「深底白字 + 宽字距」的胶囊，改成实心是为了和那边一致。
     `.chip` 基类的 border-radius:999px 和 letter-spacing 都要在这里覆盖掉。 */
  .chip.nav{display:inline-flex;align-items:center;gap:7px;
            height:34px;padding:0 15px;border-radius:999px;
            background:var(--text);color:var(--bg-0);
            border-color:transparent;font-size:12px;font-weight:500;
            letter-spacing:normal;white-space:nowrap;text-decoration:none;
            transition:transform .24s cubic-bezier(.16,1,.3,1),background .24s ease}
  .chip.nav:hover{background:var(--text);color:var(--bg-0);
                  border-color:transparent;transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.18)}
  .chip.nav[aria-disabled="true"]{cursor:not-allowed}
  .chip.nav .arw-ne{width:13px;height:13px;flex:none;opacity:1}
  /* 滚进浅色正文后顶栏翻白，白底按钮在白底上就没对比了 —— 反转成深底白字 */
  .topbar.solid .chip.nav{background:#15171C;color:#FFFFFF}
  .topbar.solid .chip.nav:hover{background:#15171C;color:#FFFFFF}
  .chip.nav.hint{animation:nudge .5s ease}
  .lang b{color:var(--text);font-weight:400}
  /* **语言切换：右下角固定，且开屏时不出现、下滑之后才显现。**
     开屏要干净（画面上没有任何文字），语言是次要操作，等用户开始看正文再给。
     它已经不在 .topbar 里了，所以显隐类挂在 body 上（`body.scrolled`），
     翻色也走 `body.lightzone` 而不是 `.topbar.solid` —— 别再往 .topbar 上找。
     阈值和字标浮现同一个（8px），和顶栏翻色的 1.3 屏是两回事。 */
  .llang { display:flex; gap:2px; padding:2px; border-radius:999px;
           border:1px solid currentColor; opacity:.48; }
  .llang button { border:0; padding:4px 10px; border-radius:999px;
                  background:transparent; color:currentColor; opacity:.8;
                  font:300 11.5px var(--font); cursor:pointer;
                  transition:opacity .2s ease,background .2s ease,color .2s ease; }
  .llang:hover { opacity:.75; }
  .llang button[aria-pressed="true"] { background:currentColor; opacity:1; }
  .llang button[aria-pressed="true"] span { color:var(--bg-0); }
  .topbar.solid .llang { color:#15171C; border-color:#15171C; opacity:.72; }
  .topbar.solid .llang button[aria-pressed="true"] span { color:#F4F5F7; }
  /* **配色和顶栏那套是反的**（按要求）：视频区白底黑字、下滑到正文后灰底白字。
     直觉上会想让它跟着背景走（深底浅字 / 浅底深字），但那样它在两个区里都很淡；
     反过来做它在两处都是「一块实底」，更像一颗常驻的控件。 */
  /* .lang is rendered in the topbar next to the experience-center action. */
  .lang-fixed .chip{background:rgba(255,255,255,.92);
                    border-color:rgba(21,23,28,.14);color:rgba(21,23,28,.72);
                    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .lang-fixed .chip:hover{background:#FFFFFF;color:#15171C;border-color:rgba(21,23,28,.38)}
  .lang-fixed .lang b{color:#15171C}
  body.lightzone .lang-fixed .chip{background:rgba(88,90,98,.88);
                                   border-color:rgba(255,255,255,.20);color:rgba(255,255,255,.82)}
  body.lightzone .lang-fixed .chip:hover{background:rgba(70,72,80,.94);
                                         color:#FFFFFF;border-color:rgba(255,255,255,.42)}
  body.lightzone .lang-fixed .lang b{color:#FFFFFF}

  /* ================= 滚动内容 ================= */
  main{position:relative;z-index:30;opacity:0;transition:opacity .8s ease}
  main.live{opacity:1}
  .spacer{height:100vh;pointer-events:none}
  .wrap{width:min(var(--max-w),calc(100% - 64px));margin-inline:auto}
  section{position:relative}
  .sheet{
    --page:#EFEFEC;
    --page-alt:#E9E9E6;
    --surface:#FFFFFF;
    --text:#17191D;
    --text-2:rgba(23,25,29,.78);
    --text-3:rgba(23,25,29,.60);
    --text-4:rgba(23,25,29,.44);
    --line:rgba(23,25,29,.13);
    --line-2:rgba(23,25,29,.20);
    --accent:#176C70;
    --accent-bright:#20A6BB;
    --page-a0:rgba(239,239,236,0);
    color:var(--text);
    background:linear-gradient(180deg,var(--page-a0) 0%,var(--page) 44vh,var(--page));
  }
  .sheet > *{position:relative;z-index:1}
  .band{padding-block:132px}
  .band + .band{border-top:1px solid var(--line)}
  .section-kicker{
    display:flex;align-items:center;gap:10px;margin:0 0 28px;
    color:var(--accent);font-size:12px;font-weight:700;line-height:1;
    letter-spacing:0;text-transform:uppercase;
  }
  .section-kicker::before{
    content:"";width:18px;height:18px;flex:none;border:1px solid currentColor;
    border-radius:50%;background:linear-gradient(90deg,transparent 25%,currentColor 25% 31%,
      transparent 31% 47%,currentColor 47% 53%,transparent 53% 69%,currentColor 69% 75%,transparent 75%);
    opacity:.62;
  }
  .display-title{
    margin:0;color:var(--text);font-size:64px;font-weight:610;line-height:1.04;
    letter-spacing:0;
  }
  .display-title .accent{color:var(--accent-bright)}
  .lede{margin:0;color:var(--text-3);font-size:17px;font-weight:300;line-height:1.78;letter-spacing:0}

  /* 产品介绍：左侧建立一句产品主张，右侧用可扫读的产品能力承接。 */
  .product-intro{padding-top:160px;padding-bottom:150px}
  /* 正文不能压在上面那段溶解区里 —— 深字落在半透明的亮照片上读不清 */
  .sheet > .band:first-of-type{padding-top:calc(44vh + clamp(30px,4vw,64px))}
  .intro-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(390px,.72fr);gap:112px;align-items:end}
  .intro-copy .display-title{max-width:720px}
  .intro-copy .lede{max-width:690px;margin-top:38px}
  .product-points{border-top:1px solid var(--line)}
  .product-point{display:grid;grid-template-columns:38px 132px 1fr;gap:16px;padding:21px 0;border-bottom:1px solid var(--line)}
  .product-point .index{color:var(--accent);font:500 10px var(--mono)}
  .product-point strong{font-size:15px;font-weight:620;line-height:1.5}
  .product-point span:last-child{color:var(--text-3);font-size:12px;line-height:1.65}

  /* ===== 演示画廊，在 section-heading 后 ===== */
  .demo-gallery{padding-block:132px 80px;background:var(--page)}
  .gallery-carousel{position:relative;max-width:1480px;margin:0 auto;padding:0 12px;touch-action:pan-y}
  .gallery-carousel-viewport{overflow:visible;border-radius:0;background:transparent;border:none;box-shadow:none}
  .gallery-carousel-track{position:relative;height:clamp(320px,38vw,500px);margin-top:48px}

  .gallery-card{position:absolute;top:50%;left:50%;width:62%;max-width:960px;
    transform:translate(-50%,-50%) scale(0.6);opacity:0;pointer-events:none;
    transition:transform 0.6s cubic-bezier(0.22,1,0.36,1),opacity 0.45s ease;
    will-change:transform,opacity;z-index:1;isolation:isolate}
  .gallery-card.is-center{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto;z-index:4}
  .gallery-card.is-center .gallery-card-frame{box-shadow:0 36px 80px -32px rgba(0,0,0,.48),0 8px 20px rgba(0,0,0,.10)}
  .gallery-card.is-left{transform:translate(calc(-50% - 48%),-50%) scale(0.55) rotate(-5deg);opacity:.68;pointer-events:auto;z-index:2;cursor:pointer}
  .gallery-card.is-right{transform:translate(calc(-50% + 48%),-50%) scale(0.55) rotate(5deg);opacity:.68;pointer-events:auto;z-index:2;cursor:pointer}
  .gallery-card.is-left:hover{transform:translate(calc(-50% - 48%),-50%) scale(0.59) rotate(-3deg);opacity:.9}
  .gallery-card.is-right:hover{transform:translate(calc(-50% + 48%),-50%) scale(0.59) rotate(3deg);opacity:.9}

  .gallery-card-frame{display:flex;flex-direction:column;background:#FCFCFD;border-radius:16px;overflow:visible;
    border:1px solid var(--line-2);box-shadow:0 24px 56px -28px rgba(0,0,0,.38),0 4px 10px rgba(0,0,0,.06)}
  .gallery-card-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 18px;
    border-bottom:1px solid var(--line);background:var(--surface)}
  .gallery-card-index{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--text-4)}
  .gallery-card-title{font-size:13px;font-weight:600;letter-spacing:.01em;color:var(--text)}
  .gallery-card-media{position:relative;background:#111417;overflow:hidden;flex:1 1 auto;
    border-radius:15px;clip-path:inset(0 round 15px);contain:paint;isolation:isolate}
  .gallery-card-video{width:100%;aspect-ratio:16/9;display:block;background:#111417;object-fit:cover;cursor:pointer}

  .gallery-card-media .play-overlay{position:absolute;z-index:2;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .3s ease}
  .gallery-card-media .play-overlay.hidden{visibility:hidden;opacity:0}
  .gallery-card-media .play-icon{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;color:#fff;transition:transform .25s ease,background .25s ease}
  .gallery-card.is-center .gallery-card-media:hover .play-icon{background:rgba(0,0,0,.7);transform:scale(1.06)}

  .gallery-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;
    border:1px solid var(--line-2);background:var(--surface);color:var(--text);
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;
    transition:transform .22s ease,background .22s ease,box-shadow .22s ease;
    box-shadow:0 6px 18px rgba(0,0,0,.12)}
  .gallery-nav:hover{background:var(--page);box-shadow:0 8px 24px rgba(0,0,0,.18);transform:translateY(-50%) scale(1.08)}
  .gallery-nav:active{transform:translateY(-50%) scale(.96)}
  .gallery-nav-prev{left:12px}
  .gallery-nav-next{right:12px}

  .gallery-dots{display:flex;justify-content:center;gap:8px;margin-top:28px;position:relative;z-index:6}
  .gallery-dot{width:28px;height:4px;border-radius:2px;background:var(--line-2);border:none;cursor:pointer;padding:0;transition:all .25s ease}
  .gallery-dot.active{background:var(--text);width:44px}
  .gallery-dot:hover:not(.active){background:var(--text-3)}

  @media (max-width:1100px){
    .gallery-carousel-track{height:clamp(260px,40vw,400px)}
    .gallery-card{width:66%}
    .gallery-card.is-left{transform:translate(calc(-50% - 44%),-50%) scale(.5) rotate(-5deg)}
    .gallery-card.is-right{transform:translate(calc(-50% + 44%),-50%) scale(.5) rotate(5deg)}
    .gallery-nav{width:42px;height:42px}
  }
  @media (max-width:720px){
    .demo-gallery{padding-block:78px 50px}
    .gallery-carousel{max-width:100%;padding:0 8px}
    .gallery-carousel-track{height:clamp(200px,48vw,300px);margin-top:32px}
    .gallery-card{width:78%}
    .gallery-card.is-left{transform:translate(calc(-50% - 38%),-50%) scale(.46) rotate(-4deg);opacity:.5}
    .gallery-card.is-right{transform:translate(calc(-50% + 38%),-50%) scale(.46) rotate(4deg);opacity:.5}
    .gallery-nav{width:38px;height:38px}
    .gallery-nav-prev{left:6px}
    .gallery-nav-next{right:6px}
    .gallery-card-header{padding:8px 12px;gap:10px}
    .gallery-card-index{font-size:10px}
    .gallery-card-title{font-size:12px}

  .section-heading{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,.48fr);gap:96px;align-items:end;margin-bottom:66px}
  .section-heading .display-title{font-size:56px}
  .section-heading .lede{max-width:500px}


  /* 评测结果：数据来自 stepaudio3-report-all@2de8582，并按
     ~/uploads/render_results.py 的 3+3+3+3 图表口径转换成页面原生图表。 */
  .benchmark-band{width:100%;background-color:var(--page-alt);background-image:linear-gradient(90deg,rgba(23,25,29,.055) 1px,transparent 1px);background-size:calc(100% / 6) 100%}
  .benchmark-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,.48fr);gap:96px;align-items:end;margin-bottom:64px}
  .benchmark-head .display-title{font-size:56px}
  .benchmark-copy .lede{max-width:500px}
  .benchmark-status{display:inline-flex;align-items:center;gap:8px;margin-top:18px;color:var(--accent);font-size:11px;font-weight:650}
  .benchmark-status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .benchmark-results{display:flex;flex-direction:column;gap:42px}
  .benchmark-section-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .benchmark-section-head h3{margin:0;color:var(--text);font-size:19px;font-weight:650;line-height:1.2;white-space:nowrap}
  .benchmark-section-head .rule{height:1px;flex:1;background:var(--line)}
  .benchmark-metric{color:var(--text-3);font-size:11px;font-weight:420;white-space:nowrap}
  .benchmark-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .benchmark-chart{min-width:0;padding:18px 17px 14px;border:1px solid var(--line);
                   border-radius:13px;background:rgba(255,255,255,.68);
                   box-shadow:0 8px 28px rgba(23,25,29,.035)}
  .benchmark-chart-head{display:flex;align-items:start;justify-content:space-between;gap:12px;margin-bottom:12px}
  .benchmark-chart h4{min-width:0;margin:0;color:var(--text);font-size:14px;font-weight:650;line-height:1.35}
  .benchmark-tag{flex:none;margin-top:1px;color:var(--text-3);font-size:9px;font-weight:600;text-transform:uppercase}
  .benchmark-models{display:flex;flex-direction:column;gap:3px}
  .benchmark-model-row{min-width:0;padding:6px 7px;border-radius:7px}
  .benchmark-model-row.ours{background:rgba(23,108,112,.075)}
  .benchmark-model-line{display:flex;align-items:center;gap:7px;min-width:0;margin-bottom:5px}
  .benchmark-model-mark{display:grid;place-items:center;width:18px;height:18px;flex:none;
                        border:1px solid var(--line);border-radius:50%;background-color:rgba(255,255,255,.82);
                        background-repeat:no-repeat;background-position:center;background-size:13px 13px;
                        color:var(--text-3);font:650 7px/1 var(--font)}
  .benchmark-model-row.ours .benchmark-model-mark{border-color:transparent;background:var(--accent);color:#fff}
  .benchmark-model-mark.has-icon{border-color:transparent;color:transparent}
  .benchmark-model-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
                        color:var(--text-3);font-size:10.5px;font-weight:420}
  .benchmark-model-row.ours .benchmark-model-name{color:var(--text);font-weight:650}
  .benchmark-value{margin-left:auto;flex:none;color:var(--text-2);font:500 11px/1 var(--mono)}
  .benchmark-model-row.ours .benchmark-value{color:var(--accent);font-weight:700}
  .benchmark-bar-track{position:relative;height:8px;overflow:hidden;border-radius:999px;background:rgba(23,25,29,.075)}
  .benchmark-bar{height:100%;min-width:2px;border-radius:inherit;background:rgba(23,25,29,.17)}

  .benchmark-model-row.pending .benchmark-bar-track{border:1px dashed rgba(23,108,112,.34);background:transparent}
  .benchmark-model-row.pending .benchmark-bar{display:none}
  /* 坐标轴必须和柱条轨道同起点；原来左边多留了 25px，导致 0/65 等基线数字
     看起来悬在柱条右侧。卡片内边距 17px + 行内边距 7px，正好与轨道一致。 */
  .benchmark-axis{display:flex;justify-content:space-between;margin:5px 7px 0 7px;

  .tbd{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:0;color:#7A551A;border:1px solid rgba(122,85,26,.35);border-radius:3px;padding:2px 6px;white-space:nowrap}

  /* 体验入口 */
  .cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:clamp(32px,4vw,44px)}
  .btn{display:inline-flex;align-items:center;gap:11px;

  .btn.primary{color:#0B0714;

    box-shadow:0 16px 42px -14px rgba(99,102,241,1)}

  /* 窄屏只压**动画起点**（.30em→.18em，小字号下 .30em 会散成一排孤字）；
     **落定值必须跟桌面同步**，否则调桌面字距时手机纹丝不动。
     ——踩过：桌面从 −.025 放到 +.02 再到 +.05，这里一直停在 .01em，
     390 宽下字标宽度三轮都是 153px 没变过。 */
  @media (max-width:640px){
    .wordmark{letter-spacing:.18em}
    #reveal.on .wordmark{letter-spacing:.05em}

    /* 触摸目标补到 44px（实测顶栏那颗 42、语言键只有 31）。
       两颗的做法不同 ——
       顶栏「体验中心」直接加高，它压在素材上、不挡任何要读的内容；
       **语言键只撑命中区、视觉尺寸一个像素不动**：它是常驻右下角的浮层，
       手机上正文占满整宽，做大就会盖住更多字（现在已经会压到图表标签）。
       伪元素继承父按钮的 pointer-events，所以只是把可点范围垫高。 */
    .chip.nav{height:34px;padding-inline:15px}
    .llang button { padding:6px 10px; }
  }
  /* 竖屏（手机为主）：素材是 16:9，铺满裁到 9:16 会正好裁在两个人中间
     —— 只剩一个后脑勺，"两个人在说话"这件事整个没了。
     所以竖屏**唯一的差异就是完整放下整帧**（contain + 画面垂直居中），
     字标/副标、endscrim、veil 全部沿用桌面那一套 —— 按要求「和电脑端一样，
     字标居于视频中间」。
     `object-position:center` 让画面落在视口正中，而 #reveal 本来就是
     `justify-content:center`，两个中心自然重合，不需要再算偏移。

     **原来那版（0901 之前）是另一种排法**：画面推到偏上（34%）、字标组用
     `padding-bottom` 顶在屏底、endscrim 减到很轻 —— 那是「字标落在画面下方的
     黑底上」的思路。它有个自身的毛病：画面和字标组各自独立锚定，中间空隙随屏高
     从 10px（320x568）摆到 137px（430x932），也就是反馈里说的「错位」。
     居中之后这个问题从根上没有了（同一个中心，无空隙可言）。 */
  @media (max-aspect-ratio:4/5){
    #stage video{object-fit:contain;object-position:center;background:var(--bg-0)}
  }
  /* 无障碍：减少动态效果只关闭字标动画；开屏视频仍按产品要求静音自动播放。 */
  @media (prefers-reduced-motion:reduce){
    #stage .endscrim{transition:none}
    /* 不演动画，直接给**落定值**（要和 #reveal.on 的 .05em 一致，别各写各的） */
    .wordmark{transition:none;filter:none;transform:none;letter-spacing:.05em}
    .sweep::after{animation:none;opacity:0}
  }
</style>

/* ===== Gallery 3D 走马灯 ===== */
function initGalleryCarousel(demos){
  const container = document.getElementById("demoGalleryCarousel");
  if (!container) return;
  const track = container.querySelector(".gallery-carousel-track");
  const prevBtn = container.querySelector(".gallery-nav-prev");
  const nextBtn = container.querySelector(".gallery-nav-next");
  const dotsContainer = document.getElementById("galleryDots");
  if (!demos || !demos.length) return;

  let current = 0;
  const total = demos.length;
  let swipeX = 0, swipeY = 0, swiped = false;

  /* 笔记本触控板的横向滑动会以 wheel(deltaX) 事件到达，而不是 pointer 拖拽。
     每个明确的横向事件只翻一页；翻页后固定冷却一小段时间，冷却期间的
     惯性事件全部忽略，并从最后一枚惯性事件重新计算冷却，避免长滑动在
     冷却结束后又被残余事件触发。这里不累计位移，也不判断速度或方向变化。 */
  if (container.__trackpadWheelCleanup) container.__trackpadWheelCleanup();
  let wheelLockedUntil = 0;
  let wheelLastAt = null;
  let wheelBurstActive = false;
  let wheelBurstTimer = 0;
  let wheelPageTimer = 0;
  const wheelQueue = [];
  // .gallery-card 的 transform 动画是 0.6s；翻页冷却设为 1.2s。
  const WHEEL_PAGE_GAP = 1200;
  // 横向 wheel 停顿超过这一时间，视为下一次独立滑动。只看事件间隔，
  // 不看位移大小、速度或方向变化，避免把长惯性拆成多页。
  const WHEEL_GESTURE_GAP = 180;
  const endWheelBurst = () => {
    wheelBurstActive = false;
    wheelBurstTimer = 0;
  };
  const scheduleWheelPage = () => {
    if (wheelPageTimer || !wheelQueue.length) return;
    const delay = Math.max(0, wheelLockedUntil - performance.now());
    wheelPageTimer = setTimeout(() => {
      wheelPageTimer = 0;
      if (!wheelQueue.length) return;
      const direction = wheelQueue.shift();
      goTo(current + direction);
      wheelLockedUntil = performance.now() + WHEEL_PAGE_GAP;
      scheduleWheelPage();
    }, delay);
  };
  const requestWheelPage = (direction, now) => {
    if (now < wheelLockedUntil || wheelQueue.length) {
      wheelQueue.push(direction);
      scheduleWheelPage();
      return;
    }
    goTo(current + direction);
    wheelLockedUntil = now + WHEEL_PAGE_GAP;
  };
  const onTrackpadWheel = event => {
    if (event.ctrlKey) return;
    const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerWidth : 1;
    const dx = event.deltaX * unit;
    const dy = event.deltaY * unit;
    if (!dx || Math.abs(dx) <= Math.abs(dy) * 1.12) return;

    event.preventDefault();
    const now = performance.now();
    const gap = wheelLastAt == null ? Infinity : now - wheelLastAt;
    const newBurst = !wheelBurstActive || gap > WHEEL_GESTURE_GAP;
    wheelLastAt = now;
    wheelBurstActive = true;
    clearTimeout(wheelBurstTimer);
    wheelBurstTimer = setTimeout(endWheelBurst, WHEEL_GESTURE_GAP);
    if (!newBurst) return;

    // 与鼠标/触摸拖拽保持同一方向：向左滑（负向 deltaX）切下一张，
    // 向右滑（正向 deltaX）切回上一张。冷却中的新滑动排队，按 1.2s
    // 间隔依次执行；同一轮连续惯性不会重复排队。
    requestWheelPage(dx < 0 ? 1 : -1, now);
  };
  container.addEventListener("wheel", onTrackpadWheel, {passive:false});
  container.__trackpadWheelCleanup = () => {
    container.removeEventListener("wheel", onTrackpadWheel);
    clearTimeout(wheelBurstTimer);
    clearTimeout(wheelPageTimer);
    delete container.__trackpadWheelCleanup;
  };

  // Drag/swipe 翻页
  container.addEventListener("pointerdown", e => {
    swipeX = e.clientX; swipeY = e.clientY; swiped = false;
  });
  container.addEventListener("pointerup", e => {
    const dx = e.clientX - swipeX, dy = e.clientY - swipeY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      swiped = true; goTo(dx > 0 ? current - 1 : current + 1);
    }
  });

  // Render cards — poster 做占位，preload=none 懒加载（参考 stepaudio3-gen-demo 模式）
  track.innerHTML = demos.map((item, i) => {
    const posterSrc = item.src.replace(/\?.*$/, "").replace(/\.mp4$/, ".jpg");
    return `<div class="gallery-card" data-title="${item.t}" data-index="${i}">
      <div class="gallery-card-frame">
        <div class="gallery-card-media">
          <video class="gallery-card-video" loop playsinline preload="none"
            poster="${posterSrc}" data-src="${item.src}" aria-label="${item.t}">
          </video>
          <div class="play-overlay">
            <div class="play-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg></div>
          </div>
        </div>
      </div>
    </div>`;
  }).join("");

  const cards = track.querySelectorAll(".gallery-card");

  // Dots
  dotsContainer.innerHTML = "";
  for (let i = 0; i < total; i++){
    const dot = document.createElement("button");
    dot.className = "gallery-dot" + (i === 0 ? " active" : "");
    dot.addEventListener("click", () => goTo(i));
    dotsContainer.appendChild(dot);
  }
  const dots = dotsContainer.querySelectorAll(".gallery-dot");

  /* 只响应用户点击。play() 必须留在点击调用栈里，Safari 才会允许带声音播放。 */
  function loadAndPlay(video){
    if (!video) return;
    if (!video.src && video.dataset.src) {
      video.src = video.dataset.src;
      video.load();
    }
    const p = video.play();
    if (p && p.catch) p.catch(() => syncOverlay(video.closest(".gallery-card")));
  }

  function goTo(index){
    current = ((index % total) + total) % total;
    const leftIdx  = (current - 1 + total) % total;
    const rightIdx = (current + 1) % total;

    cards.forEach((card, i) => {
      card.classList.remove("is-center", "is-left", "is-right");
      if (i === current)       card.classList.add("is-center");
      else if (i === leftIdx)  card.classList.add("is-left");
      else if (i === rightIdx) card.classList.add("is-right");
    });

    // 暂停非当前视频
    cards.forEach((card, i) => {
      const v = card.querySelector("video");
      if (!v) return;
      if (i !== current) v.pause();
    });

    dots.forEach((d, i) => d.classList.toggle("active", i === current));
    cards.forEach(c => syncOverlay(c));
  }

  function syncOverlay(card){
    const v = card.querySelector("video");
    const ov = card.querySelector(".play-overlay");
    if (!v || !ov) return;
    const playing = !v.paused && !v.ended;
    ov.classList.toggle("hidden", playing);
  }

  // Click handlers
  cards.forEach(card => {
    card.addEventListener("click", e => {
      if (swiped) return;
      if (card.classList.contains("is-left"))  { goTo(current - 1); return; }
      if (card.classList.contains("is-right")) { goTo(current + 1); return; }
      if (card.classList.contains("is-center")){
        const v = card.querySelector("video");
        if (!v) return;
        if (v.paused) { loadAndPlay(v); } else { v.pause(); }
        syncOverlay(card);
      }
    });
    const v = card.querySelector("video");
    if (v){
      v.addEventListener("play",  () => syncOverlay(card));
      v.addEventListener("pause", () => syncOverlay(card));
      v.addEventListener("ended", () => syncOverlay(card));
    }
  });

  prevBtn.addEventListener("click", e => { e.stopPropagation(); goTo(current - 1); });
  nextBtn.addEventListener("click", e => { e.stopPropagation(); goTo(current + 1); });

  container.tabIndex = 0;
  container.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft")  goTo(current - 1);
    if (e.key === "ArrowRight") goTo(current + 1);
  });

  // 初始和翻页都只显示 poster；必须点击中间卡片才播放。
  goTo(0);
}

/* 三个播放器互斥播放，避免两条演示音轨同时发声。 */
function initDemoVideos(){
  document.addEventListener("play", e => {
    if (e.target.tagName !== "VIDEO") return;
    document.querySelectorAll("video").forEach(other => {
      if (other !== e.target && !other.paused) other.pause();
    });
  }, {passive:true});
}

/* ============================================================
   开屏时序：素材淡入 → 播完 5 幕 → 字标随第 5 幕浮现 → 放开滚动 → 第 5 幕循环
   ============================================================ */
const stage = $("stage"), video = $("hero"), reveal = $("reveal");
let timers = [], finished = false, revealed = false, looping = false;

/* ============================================================
   循环回绕：接在**视频文件里做好的那次交叉转场**上
   ------------------------------------------------------------
   循环范围现在是**完整三段**：原第四幕 → A03 → A23，然后回到第一段继续。
   为什么不是别的做法（都试过、都被否）：
     · `video.loop=true`  —— 回绕是一次真实 seek（pause→ended→seeking→waiting→seeked），
       本地无网络延迟都实测 27ms 停顿 + 掉帧；且回到 0 是硬切。
     · 盖一张静图去溶接缝 —— 跳变没了，但画面会短暂停住，
       换来的是更明显的卡顿感（用户反馈的就是这个）。
     · 两路 video 交叉 —— 视觉最好，但同页两个 video 对同一 URL 不共享媒体缓冲，
       首次加载要多下整片一遍（实测 16MB → 31MB），交叉时双解码帧间隔涨到 52.8ms。
       对远程访问反而更卡，所以放弃。
   现在的做法：**build_hero 已经把「A23 末尾 → 第一段开头」做成了一次正常的交叉转场**
   （和镜头之间的切换同一种转场，写进文件里）。所以页面只需在播完时 seek 到 LOOP_BACK。
   单路、零额外带宽、画面全程在动。
   ============================================================ */
/* 必须和 build_hero.py 打印出来的 LOOP_BACK 一致（= 第一段开头 + LOOP_XF，
   且是 1/FPS 的整数倍，并在那里钉了关键帧）。改剪辑后照着脚本输出改这里。 */
const LOOP_BACK = 0.48;

function loopBack(){
  try { video.currentTime = LOOP_BACK; } catch (e) {}
  const p = video.play();
  if (p && p.catch) p.catch(() => {});
}

/* 字标浮现。现在由 start() 在开屏第一帧直接触发，与视频淡入同时开始；
   这一步不碰 video，只管字标、压暗和正文可见状态。 */
function revealMark(fast){
  if (revealed) return;
  revealed = true;
  // 滚动触发要立刻看得见（见 #reveal.fast 的注释）；时间触发保持原来的慢浮现
  if (fast) reveal.classList.add("fast");
  // .ended 同时开启 endscrim 压暗 —— 字标要压在动态画面上，得先把画面压下去。
  // 点跳过时舞台可能还没淡入过，.playing 在这里补上。
  stage.classList.add("playing", "ended");
  reveal.classList.add("on");
  // 滚动早就是放开的，这里只需保证正文可见 + 同步一次滚动态
  $("main").classList.add("live");
  onScroll();
  // 摘 transition 要等字标那条 1.6s 淡入**演完**再做，
  // 否则会在 75% 处被 transition:none 硬拉到 1，看着是一下跳帧。
  timers.push(setTimeout(() => reveal.classList.add("nofade"),
                         reduceMotion ? 0 : (fast ? 700 : 1900)));
}

/* 正片放完（字标已经定住）→ 开始**完整循环三段素材**。
   hero 靠 'ended' 触发，所以到这一步才回绕 —— 提前设 video.loop 就永远不会 ended。 */
function startSceneLoop(){
  if (looping) return;
  looping = true;
  stopRevealWatch();                // 定形之后不用再逐帧盯 currentTime
  // 两种入口：正常播完（video.ended，立刻接回转场点继续）
  // 或点了跳过 / autoplay 被拦（视频还在中间，让它继续播，到 ended 时自然回绕）。
  if (video.ended) loopBack();
  else { const p = video.play(); if (p && p.catch) p.catch(() => {}); }
}

/* 直达最终态（点跳过、autoplay 被拦、素材加载不出来时的兜底）。两步都是幂等的。 */
function finish(){
  if (finished) return;
  finished = true;
  timers.forEach(clearTimeout); timers = [];
  revealMark();
  startSceneLoop();
}

/* Logo / slogan 必须等视频真正进入 `playing` 后再开始浮现，不能只等 canplay 或 play() Promise。
   `playing` 表示首帧已经开始向前推进；Safari 首次缓冲时，canplay 到 playing 之间可能仍会停一下。 */
let revealRaf = 0;
const REVEAL_AT = 0.0;
/* 8px 阈值只用于顶栏/语言控件的滚动态；滚动不再触发 Logo 与 slogan。 */
const SCROLL_REVEAL_AT = 8;

function revealWatch(){
  if (looping){ revealRaf = 0; return; }
  if (!video.paused && video.currentTime > 0){ revealMark(); revealRaf = 0; return; }
  revealRaf = requestAnimationFrame(revealWatch);
}

function stopRevealWatch(){
  if (revealRaf) cancelAnimationFrame(revealRaf);
  revealRaf = 0;
}

/* `<video autoplay>` 负责原生起播。这里是兼容兜底：素材还没缓冲好就等 canplay，
   再补一次静音 play；不能在空 buffer 上反复 pause/play。 */
function startVideo(){
  const go = () => {
    // Safari 对自动播放的判定会同时看属性与 DOM attribute；两边都明确设为静音自动播放。
    video.autoplay = true;
    video.muted = true;
    video.defaultMuted = true;
    video.setAttribute("muted", "");
    const p = video.play();
    if (p && p.catch) p.catch(() => {});
    // 与 playing 事件互为兜底，但只有 currentTime 真正开始推进才会 reveal。
    if (!revealed && !revealRaf) revealRaf = requestAnimationFrame(revealWatch);
  };
  if (video.readyState >= 3) go();
  else video.addEventListener("canplay", go, {once:true});
}

/* 开场：不再有黑屏闪字那一段，进页面就是素材淡入 + 起播。
   起播必须和画面淡入同一时刻（并且缓冲不够时等 canplay）—— 否则第一镜又会被吃掉，
   这是之前踩过的坑，见 startVideo()。 */
function start(){
  timers.forEach(clearTimeout); timers = [];
  finished = false; revealed = false; looping = false;
  // **不再锁滚动**（按要求：打开页面就能下滑，不必等视频演完）。
  // main 立即 .live 也是安全的：它 z-index 最高，但第一个子元素是 100vh 的透明
  // .spacer，第一屏看到的仍是下面的视频层。
  document.scrollingElement.scrollTop = 0;
  stage.classList.remove("playing", "ended");
  reveal.classList.remove("on");
  reveal.classList.remove("nofade");
  reveal.classList.remove("fast");
  reveal.style.removeProperty("opacity");
  stopRevealWatch();
  $("main").classList.add("live");

  // `<video autoplay>` 已经从 0 开始起播；这里不要再 pause→play 打断原生 autoplay。
  // 真实 Safari 会把这组相反操作视为一次启动竞态，表现为停在 poster。
  // 下一帧先让画面进入淡入并尝试起播；Logo 与 slogan 由 playing 事件触发。
  requestAnimationFrame(() => {
    stage.classList.add("playing");
    startVideo();
  });

  // 缓冲较久时只重试起播，绝不在时间轴尚未推进时提前显示 Logo / slogan。
  timers.push(setTimeout(() => {
    if (video.paused && !video.error) startVideo();
  }, T_SAFETY));
}

// 第一次播完 → 进最终态；之后每次播完 → 回到三段轮播的第一段继续
video.addEventListener("ended", () => { looping ? loopBack() : finish(); });
video.addEventListener("error", () => setTimeout(finish, 600));
video.addEventListener("playing", () => revealMark(), {once:true});
// Safari 从后台恢复或通过前进/后退缓存回到页面时可能保留 paused 状态；
// 页面重新可见时补一次静音 play，不重置 currentTime，也不破坏回环位置。
function resumeHero(){
  if (document.hidden || !video.paused || video.ended) return;
  video.muted = true;
  video.defaultMuted = true;
  const p = video.play();
  if (p && p.catch) p.catch(() => {});
}
addEventListener("pageshow", () => requestAnimationFrame(resumeHero));
document.addEventListener("visibilitychange", resumeHero);
$("langBtn").addEventListener("click", () => {
  lang = lang === "zh" ? "en" : "zh";
  renderCopy();
  // 语言切换只更新文案和选中态，不重置滚动位置或重新播放首屏视频。
});

/* ============================================================
   滚动：素材层与字标随第一屏淡出
   ============================================================ */
function onScroll(){
  const h = innerHeight || 1;
  const top = document.scrollingElement.scrollTop || 0;
  // 还在第一屏顶上时不要写 inline opacity —— 否则会盖掉字标浮现那条 transition，
  // 淡入演到一半被硬拉到 1，看着像跳帧。
  const bar = document.querySelector(".topbar");
  // `body.scrolled` 管右下角语言按钮的显现，阈值很小；
  // `body.lightzone` / `.topbar.solid`（1.3 屏）是翻色，两者无关。
  document.body.classList.toggle("scrolled", top > SCROLL_REVEAL_AT);
  if (top <= 0){
    stage.style.removeProperty("opacity");
    reveal.style.removeProperty("opacity");
    bar.classList.remove("solid");
    document.body.classList.remove("lightzone");
    return;
  }
  // 素材层**不再淡出**：让浅色区那段透明→浅色的渐变自己盖上去，
  // 亮度就从「照片」直接走到「白页」，中间不再凹一段黑。
  // 字标则要提前淡完（0→38vh），否则会被溶解区洗成一团糊字。
  reveal.style.opacity = revealed
    ? Math.max(0, 1 - top / (h * .38)).toFixed(3)
    : "0";
  // 详情纸面在首屏末端前 380px 开始溶入，接近铺满顶栏时再翻成深色控件。
  const light = top > Math.max(h * .62, h - 150);
  bar.classList.toggle("solid", light);
  document.body.classList.toggle("lightzone", light);
}
addEventListener("scroll", onScroll, {passive:true});
addEventListener("resize", onScroll);

/* 竖屏的排版**不再需要 JS 参与**。
   0901 那一版有个 fitPortrait()：竖屏下画面（object-position 百分比）和字标组
   （padding-bottom）各自独立锚定，中间空隙随屏高从 10px 摆到 137px，
   所以拿 JS 按实测算「上下留白相等 + 间距恒定」。
   现在字标改成和桌面一样压在画面正中（见 max-aspect-ratio 那段 CSS），
   两者共用同一个中心，整段计算连同 ResizeObserver 一起删掉了。 */

renderCopy();
start();
</script>
</body>
</html>
