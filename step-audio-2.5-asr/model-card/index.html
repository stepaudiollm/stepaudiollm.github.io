<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StepAudio 2.5 ASR Model Card</title>
    <meta
      name="description"
      content="StepAudio 2.5 ASR bilingual model card for technical developers, covering model information, training data, evaluation results, public interfaces, and usage boundaries."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="sidebar">
        <div class="sidebar__inner">
          <a class="brand" href="#overview" aria-label="StepAudio 2.5 ASR Model Card">
            <span class="brand__eyebrow">Model Card</span>
            <strong class="brand__title">StepAudio 2.5 ASR</strong>
          </a>

          <div class="locale-switch" role="tablist" aria-label="Language switch">
            <button class="locale-switch__button is-active" type="button" data-locale="zh">中文</button>
            <button class="locale-switch__button" type="button" data-locale="en">English</button>
          </div>

          <nav class="section-nav" aria-label="Model card sections" id="section-nav"></nav>
          <div class="sidebar-note" id="sidebar-note"></div>
        </div>
      </aside>

      <main class="main-column">
        <article class="document-surface">
          <header class="document-header" id="overview">
            <div id="header-content"></div>
          </header>

          <section class="doc-section" id="model-information">
            <div id="model-information-content"></div>
          </section>

          <section class="doc-section" id="model-data">
            <div id="model-data-content"></div>
          </section>

          <section class="doc-section" id="evaluation">
            <div id="evaluation-content"></div>
          </section>

          <section class="doc-section" id="distribution">
            <div id="distribution-content"></div>
          </section>

          <section class="doc-section" id="intended-usage-limitations">
            <div id="intended-usage-limitations-content"></div>
          </section>

          <section class="doc-section" id="ethics-content-safety">
            <div id="ethics-content-safety-content"></div>
          </section>


          <footer class="page-footer" id="footer"></footer>
        </article>
      </main>
    </div>

    <script src="./content.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
